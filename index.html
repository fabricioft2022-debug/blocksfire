<style>
/* Layout: full-bleed lobby stage (canvas) with floating UI slabs; match is a top-down canvas with floating-stick touch input. Single dark look by choice. */
:root{
  --bg:#0b111b; --panel:#141d2b; --panel2:#1c2839; --line:#2a3a52;
  --fg:#eaf1fb; --mut:#8fa3bf; --accent:#ffb400; --accent-ink:#2a1a00;
  --cyan:#3cc8ff; --danger:#ff4d57; --ok:#41d98a;
  --f-display:'Russo One',Impact,'Arial Black',sans-serif;
  --f-body:'Chakra Petch',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.screen{position:fixed;inset:0;overflow:hidden}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;flex:none}
canvas{display:block}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px;padding:6px 14px;background:var(--panel2);
  border:1px solid var(--line);border-radius:3px;box-shadow:0 3px 0 rgba(0,0,0,.45);font-family:var(--f-display);font-size:13px;
  letter-spacing:.04em;text-transform:uppercase;transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:#ffd25a}
.btn.danger{background:#5a1c24;border-color:var(--danger)}
.btn.block{width:100%}

/* ---------- lobby ---------- */
#stage{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.topbar{position:absolute;z-index:3;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));
  top:calc(env(safe-area-inset-top,0px) + 8px);display:flex;gap:8px;align-items:center;pointer-events:none}
.topbar>*{pointer-events:auto}
.profile{display:flex;gap:8px;align-items:center;background:rgba(9,15,25,.82);border:1px solid var(--line);padding:4px 12px 4px 4px;min-width:0;text-align:left}
.lvl{width:36px;height:36px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-size:17px}
.pn{display:flex;flex-direction:column;gap:4px;min-width:0}
.pn b{font-size:14px;white-space:nowrap;max-width:132px;display:flex;align-items:center;gap:4px;min-width:0}.pn b .vn{overflow:hidden;text-overflow:ellipsis;min-width:0}.vb{height:1.2em;width:auto;vertical-align:-.25em;margin-left:4px;flex:none;filter:drop-shadow(0 0 2px rgba(255,170,0,.55))}.pn b .vb{margin-left:0}.vtag{display:inline-flex;align-items:center;gap:4px;margin-left:8px;color:#ffc933;font-weight:700}.vtag .vb{margin-left:0}
.xpbar{display:block;width:96px;height:5px;background:#243247}
.xpbar i{display:block;height:100%;width:0;background:var(--cyan)}
.cur{display:flex;gap:6px}
.chip{display:flex;align-items:center;gap:6px;background:rgba(9,15,25,.82);border:1px solid var(--line);padding:6px 10px;font-weight:700;font-variant-numeric:tabular-nums}
.tools{margin-left:auto;display:flex;gap:6px}
.sq{width:38px;height:38px;display:grid;place-items:center;background:rgba(9,15,25,.82);border:1px solid var(--line);font-size:17px}
.sq.off{opacity:.45;text-decoration:line-through}

.sidemenu{position:absolute;z-index:2;left:max(12px,env(safe-area-inset-left,0px));top:calc(env(safe-area-inset-top,0px) + 64px);
  display:flex;flex-direction:column;gap:4px;width:126px}
.side{display:flex;align-items:center;gap:8px;height:38px;padding:0 10px;background:rgba(9,15,25,.78);border:0;border-left:3px solid var(--accent);
  font-family:var(--f-display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;text-align:left}
.side:active{background:rgba(255,180,0,.22)}
/* fix: sidemenu must stay above the bottom bar (Cofre/Armas...) so Correio isn't covered */
.sidemenu{z-index:4;bottom:calc(env(safe-area-inset-bottom,0px) + 10px + 46px + 8px);overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;touch-action:pan-y}.sidemenu::-webkit-scrollbar{display:none}.sidemenu>*{flex:none}
.newsbtn{height:58px;margin-bottom:4px;border:0;border-left:3px solid var(--cyan);padding:8px 10px;text-align:left;display:flex;align-items:flex-end;
  background:linear-gradient(135deg,#31207a 0%,#7a2fb5 55%,#ff8a1f 100%);font-family:var(--f-display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;position:relative}
.newsbtn::after{content:"";position:absolute;right:8px;top:8px;width:16px;height:16px;background:var(--accent);transform:rotate(45deg)}

.right{position:absolute;z-index:2;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 10px);width:236px;display:flex;flex-direction:column;gap:8px}

.fr{display:flex;align-items:center;gap:8px;padding:5px 10px;font-size:13px;border-top:1px solid #1d2a3d}

.fr button{min-width:26px;height:24px;background:#24344c;border:1px solid var(--line);font-size:12px;padding:0 6px}
.fr button.on{background:var(--ok);color:#06210f;border-color:var(--ok)}
.ctl{display:flex;gap:6px}
.ctl select{flex:1;min-width:0;height:38px;background:rgba(9,15,25,.9);color:var(--fg);border:1px solid var(--line);font-family:var(--f-display);font-size:12px;padding:0 8px}
.go{display:flex;align-items:center;justify-content:center;gap:10px;height:56px;background:var(--accent);color:var(--accent-ink);border:0;font-family:var(--f-display);
  font-size:24px;letter-spacing:.06em;box-shadow:0 4px 0 #a86f00;transition:transform .08s}
.go:active{transform:translateY(3px);box-shadow:0 1px 0 #a86f00}
.ver{text-align:right;font-size:10px;color:var(--mut);letter-spacing:.1em}

.lobby-feature{background:linear-gradient(135deg,rgba(19,34,55,.94),rgba(39,55,78,.88));border:1px solid rgba(255,198,74,.58);box-shadow:0 5px 18px rgba(0,0,0,.24);padding:9px 10px;color:#f4f6ff}.lf-head{font-family:var(--f-display);font-size:12px;letter-spacing:.12em;color:#ffd36a}.lf-copy{font-size:11px;line-height:1.35;color:#d4deed;margin:5px 0 7px}.lobby-feature button{width:100%;min-height:30px;background:rgba(255,190,54,.14);border:1px solid rgba(255,205,99,.65);color:#ffe3a0;font-family:var(--f-display);font-size:11px;letter-spacing:.04em}.map-pick{display:flex;flex-direction:column;gap:4px;padding:7px 9px;background:rgba(9,15,25,.9);border:1px solid var(--line);color:#ffe0a0;font-family:var(--f-display);font-size:11px;letter-spacing:.06em}.map-pick select{height:34px;width:100%;background:#17263a;color:var(--fg);border:1px solid var(--line);padding:0 8px;font:12px var(--f-display)}
@media(max-height:620px){.lobby-feature{display:none}}
.bottombar{position:absolute;z-index:2;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 10px);display:flex;gap:4px}
.tab4{display:flex;align-items:center;gap:8px;height:46px;padding:0 14px;background:rgba(9,15,25,.82);border:0;border-bottom:3px solid var(--line);
  font-family:var(--f-display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.tab4:active{border-bottom-color:var(--accent);background:rgba(255,180,0,.2)}

@media (max-aspect-ratio:1/1){
  .sidemenu{bottom:calc(env(safe-area-inset-bottom,0px) + 10px + 48px + 8px)}
  .right{left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));width:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 64px);
    display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .friends{grid-column:1/2;grid-row:1/3;align-self:end}
  .ctl{grid-column:2/3}
  .go{grid-column:2/3}
  .ver{display:none}
